#MACHINE ?= "qemux86-64"
#MACHINE ?= "raspberrypi0-wifi"
MACHINE ?= "raspberrypi0-2w-64"
DL_DIR ?= "/media/operador/pseudonas/build/yocto/downloads"
SSTATE_DIR ?= "/media/operador/pseudonas/build/yocto/sstate-cache"
TMPDIR = "/media/operador/pseudonas/build/yocto/tmp"
DEPLOY_DIR = "/media/operador/pseudonas/build/yocto/deploy"
DISTRO ?= "poky"
PACKAGE_CLASSES ?= "package_ipk"
SDKMACHINE ?= "x86_64"
#IMAGE_PKGTYPE = " wic ext4"

EXTRA_IMAGE_FEATURES ?= " debug-tweaks"
# EXTRA_IMAGE_FEATURES:remove ?= " debug-tweaks"
# EXTRA_IMAGE_FEATURES:append ?= " allow-root-login"

USER_CLASSES ?= "buildstats"

# Runtime testing of images
#IMAGE_CLASSES += "testimage testsdk"
#TESTIMAGE_AUTO:qemuall = "1"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
BB_HASHSERVE = "auto"
BB_SIGNATURE_HANDLER = "OEEquivHash"
BB_SERVER_TIMEOUT = "600"
CONF_VERSION = "2"

IMAGE_FSTYPES = "rpi-sdimg"

PARALLEL_MAKE = "-j 2"
BB_NUMBER_THREADS = "1"
XZ_DEFAULTS = "--memlimit=2024MiB"
ENABLE_UART = "1"
IMAGE_OVERHEAD_FACTOR = "1.8"

IMAGE_INSTALL:append = " python3 python3-venv python3-pip"
#IMAGE_INSTALL:append = " hello"
#IMAGE_INSTALL:append = " newuser"

# CONF_VERSION = "3"
#
# 2 - configs from blogpost
# 3 - Add QEMU MACHINE
# 4 - Add extra space
# 5 - Python3 packages
INHERIT+="toaster buildhistory"

